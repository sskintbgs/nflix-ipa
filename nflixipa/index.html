<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#E50914" />
<title>FluxTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --red: #E50914;
  --red-hot: #f6121d;
  --bg: #141414;
  --bg-card: #1a1a1a;
  --bg-elev: #2a2a2a;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666;
  --green: #46d369;
  --navbar-h: 56px;
  --mobile-nav: 60px;
  --card-w: 110px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; scroll-behavior: smooth; height: 100%; }
body {
  font-family: 'Figtree', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  min-height: 100%;
  min-height: 100dvh;
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
  overscroll-behavior: none;
}
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
button, input, select, textarea {
  font-family: inherit; border: none; background: none; color: inherit; cursor: pointer;
}
button:disabled { opacity: 0.4; cursor: not-allowed; }
.hidden { display: none !important; }
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-thumb { background: var(--red); border-radius: 99px; }
::-webkit-scrollbar-track { background: transparent; }

/* ═══════════════ NAVBAR ═══════════════ */
#navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: calc(var(--navbar-h) + var(--safe-top));
  padding-top: var(--safe-top);
  display: flex; align-items: center;
  background: linear-gradient(to bottom, rgba(0,0,0,0.88), transparent);
  transition: background 0.3s ease, backdrop-filter 0.3s ease;
}
#navbar.scrolled {
  background: rgba(20,20,20,0.97);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.navbar-inner {
  display: flex; align-items: center; width: 100%;
  padding: 0 4%; gap: 0.75rem; height: var(--navbar-h);
}
.nav-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.85rem; color: var(--red); letter-spacing: 3px;
  cursor: pointer; flex-shrink: 0; line-height: 1;
  transition: opacity 0.15s, transform 0.15s;
  -webkit-touch-callout: none;
}
.nav-logo span { color: #fff; letter-spacing: 2px; margin-left: 1px; }
.nav-logo:active { opacity: 0.75; transform: scale(0.96); }
.nav-right { display: flex; align-items: center; gap: 0.35rem; margin-left: auto; }
.nav-icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--text-muted); transition: color 0.15s, background 0.15s, transform 0.12s;
}
.nav-icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.08); color: var(--text); }
.nav-icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ═══════════════ MAIN ═══════════════ */
#app { min-height: 100dvh; }
#view {
  min-height: 100dvh;
  padding-bottom: calc(var(--mobile-nav) + var(--safe-bot) + 0.5rem);
  animation: fadeIn 0.25s ease both;
}
#view.page-enter {
  animation: pageIn 0.35s var(--ease) both;
}

/* ═══════════════ HERO ═══════════════ */
.hero {
  position: relative;
  height: min(72vh, 560px);
  min-height: 420px;
  overflow: hidden;
  background: #000;
  margin-top: 0;
}
.hero-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center top;
  transform: scale(1.06);
  animation: heroZoom 12s ease-out forwards;
}
@keyframes heroZoom {
  from { transform: scale(1.08); }
  to { transform: scale(1); }
}
.hero::after {
  content: ''; position: absolute; inset: 0;
  background:
    linear-gradient(to right, rgba(0,0,0,0.82) 30%, transparent 75%),
    linear-gradient(to top, rgba(20,20,20,1) 0%, rgba(20,20,20,0.55) 22%, transparent 48%),
    linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, transparent 28%);
}
.hero-content {
  position: absolute; bottom: 12%; left: 4%; right: 4%; z-index: 2;
  max-width: 520px;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--red); margin-bottom: 0.65rem;
  opacity: 0; animation: fadeUp 0.55s 0.2s var(--ease) forwards;
}
.hero-badge::before {
  content: ''; width: 14px; height: 3px; background: var(--red); border-radius: 2px;
}
.hero-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.4rem, 11vw, 3.8rem);
  line-height: 0.95; letter-spacing: 1.5px; margin-bottom: 0.65rem;
  text-shadow: 0 4px 24px rgba(0,0,0,0.6);
  opacity: 0; animation: fadeUp 0.55s 0.35s var(--ease) forwards;
}
.hero-meta {
  display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap;
  margin-bottom: 0.7rem; font-size: 0.84rem;
  opacity: 0; animation: fadeUp 0.55s 0.5s var(--ease) forwards;
}
.hero-rating { color: var(--green); font-weight: 700; }
.hero-sep { color: var(--text-dim); }
.hero-chip {
  padding: 2px 7px; border: 1px solid rgba(255,255,255,0.2);
  border-radius: 3px; color: var(--text-muted); font-size: 0.72rem; font-weight: 600;
}
.hero-overview {
  font-size: 0.88rem; line-height: 1.55; color: rgba(255,255,255,0.82);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 1.25rem;
  opacity: 0; animation: fadeUp 0.55s 0.65s var(--ease) forwards;
}
@media (max-width: 380px) {
  .hero-overview { -webkit-line-clamp: 2; }
}
.hero-buttons {
  display: flex; gap: 0.65rem; flex-wrap: wrap;
  opacity: 0; animation: fadeUp 0.55s 0.8s var(--ease) forwards;
}

/* ═══════════════ BUTTONS ═══════════════ */
.btn-play {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  padding: 0.65rem 1.4rem; background: var(--text); color: #000;
  border-radius: 4px; font-size: 0.95rem; font-weight: 700;
  transition: background 0.15s, transform 0.12s;
  touch-action: manipulation;
}
.btn-play:active { background: rgba(255,255,255,0.82); transform: scale(0.97); }
.btn-play svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }

.btn-ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
  padding: 0.65rem 1.15rem;
  background: rgba(109,109,110,0.55); color: var(--text);
  border-radius: 4px; font-size: 0.9rem; font-weight: 650;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: background 0.15s, transform 0.12s;
  touch-action: manipulation;
}
.btn-ghost:active { background: rgba(109,109,110,0.75); transform: scale(0.97); }
.btn-ghost svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
.btn-ghost.is-on { background: rgba(229,9,20,0.22); box-shadow: inset 0 0 0 1px rgba(229,9,20,0.45); }

.btn-red {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  padding: 0.7rem 1.4rem; background: var(--red); color: #fff;
  border-radius: 4px; font-size: 0.95rem; font-weight: 700;
  box-shadow: 0 6px 22px rgba(229,9,20,0.35);
  transition: background 0.15s, transform 0.12s;
  touch-action: manipulation;
}
.btn-red:active { background: var(--red-hot); transform: scale(0.97); }
.btn-red svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }

.btn-block { width: 100%; }
.btn-lg { padding: 0.85rem 1.5rem; font-size: 1rem; }

/* ═══════════════ CAROUSELS ═══════════════ */
.home-rows {
  position: relative; z-index: 3;
  margin-top: -8px; padding-bottom: 1.5rem;
}
.carousel-section {
  margin-bottom: 1.65rem;
  opacity: 1; transform: none;
  transition: opacity 0.7s ease, transform 0.7s var(--ease);
}
.carousel-section[data-lazy="true"] {
  opacity: 0; transform: translateY(24px);
}
.carousel-header {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0 4%; margin-bottom: 0.55rem;
}
.carousel-title {
  font-size: 1rem; font-weight: 700; color: var(--text-muted);
  transition: color 0.2s;
}
.carousel-section:active .carousel-title,
.carousel-section:hover .carousel-title { color: var(--text); }
.carousel-viewport {
  overflow-x: auto; overflow-y: visible;
  scrollbar-width: none; -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
  padding: 0.35rem 0 0.5rem;
  scroll-snap-type: x mandatory;
}
.carousel-viewport::-webkit-scrollbar { display: none; }
.carousel-track {
  display: flex; gap: 6px; flex-wrap: nowrap;
  padding: 0 4%;
}

/* ═══════════════ CARDS ═══════════════ */
.c-card {
  flex-shrink: 0; width: var(--card-w); position: relative;
  border-radius: 4px; overflow: hidden; cursor: pointer;
  scroll-snap-align: start;
  background: var(--bg-elev);
  transition: transform 0.22s var(--ease);
  touch-action: manipulation; -webkit-touch-callout: none;
  animation: cardIn 0.45s var(--ease) both;
}
.c-card:active { transform: scale(0.94); }
.c-card img {
  width: 100%; aspect-ratio: 2/3; object-fit: cover;
  background: var(--bg-elev);
}
.c-card-ph {
  width: 100%; aspect-ratio: 2/3;
  display: grid; place-items: center;
  font-size: 1.6rem; font-weight: 800; color: var(--text-dim);
  background: linear-gradient(145deg, #1f1f1f, #2c2c2c);
  font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px;
}
.c-badge {
  position: absolute; top: 0.35rem; left: 0.35rem;
  font-size: 0.55rem; font-weight: 700; padding: 2px 5px;
  border-radius: 3px; text-transform: uppercase; letter-spacing: 0.04em;
  z-index: 2; color: #fff;
}
.c-badge.movie { background: var(--red); }
.c-badge.tv { background: #1a6bb5; }
.c-rating-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 1rem 0.4rem 0.28rem;
  background: linear-gradient(to top, rgba(0,0,0,0.92), transparent);
  font-size: 0.62rem; font-weight: 700; color: var(--green); z-index: 2;
}
.c-rating-bar span { color: var(--text-muted); font-weight: 500; }
.c-progress {
  position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
  background: rgba(255,255,255,0.18); z-index: 3;
}
.c-progress > i { display: block; height: 100%; background: var(--red); }
.c-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 1.4rem 0.45rem 0.4rem;
  background: linear-gradient(to top, rgba(0,0,0,0.88), transparent);
  font-size: 0.68rem; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  opacity: 0; transform: translateY(4px);
  transition: opacity 0.2s, transform 0.2s; z-index: 2;
}
.c-card:active .c-label { opacity: 1; transform: translateY(0); }

/* Top 10 */
.c-card.top10 { width: calc(var(--card-w) + 36px); }
.top10-rank {
  position: absolute; left: -6px; bottom: -6px;
  font-family: 'Bebas Neue', sans-serif; font-size: 4.6rem; line-height: 1;
  color: transparent; -webkit-text-stroke: 2.5px rgba(255,255,255,0.72);
  z-index: 2; pointer-events: none;
  text-shadow: 0 0 18px rgba(0,0,0,0.7);
}
.top10-wrap { margin-left: 30px; border-radius: 4px; overflow: hidden; }
.top10-wrap img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }

.c-card:nth-child(1) { animation-delay: 0.02s; }
.c-card:nth-child(2) { animation-delay: 0.05s; }
.c-card:nth-child(3) { animation-delay: 0.08s; }
.c-card:nth-child(4) { animation-delay: 0.11s; }
.c-card:nth-child(5) { animation-delay: 0.14s; }
.c-card:nth-child(n+6) { animation-delay: 0.17s; }

/* ═══════════════ GRID ═══════════════ */
.search-grid, .browse-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
  gap: 6px; padding: 0 4%;
}
.search-grid .c-card, .browse-grid .c-card { width: 100%; }

/* ═══════════════ SEARCH SHEET ═══════════════ */
#search-sheet {
  position: fixed; inset: 0; z-index: 180;
  background: var(--bg);
  padding: calc(var(--safe-top) + 0.75rem) 0 calc(var(--mobile-nav) + var(--safe-bot) + 1rem);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  animation: slideUp 0.28s var(--ease) both;
}
.search-bar-wrap {
  padding: 0 4% 1rem;
  display: flex; gap: 0.5rem; align-items: center;
}
.search-bar-input {
  flex: 1; background: var(--bg-elev);
  border: 1px solid rgba(255,255,255,0.14); color: var(--text);
  padding: 0.7rem 1rem; font-size: 0.95rem; border-radius: 6px;
  outline: none; transition: border-color 0.15s;
  -webkit-appearance: none;
}
.search-bar-input:focus { border-color: var(--red); }
.search-bar-input::placeholder { color: var(--text-dim); }
.search-cancel {
  font-size: 0.9rem; font-weight: 600; color: var(--text-muted);
  padding: 0.5rem 0.25rem; white-space: nowrap;
  transition: color 0.15s;
}
.search-cancel:active { color: var(--text); }
.search-heading {
  padding: 0 4% 0.85rem; font-size: 0.88rem; color: var(--text-muted);
}
.search-heading strong { color: var(--text); }
.search-filters {
  padding: 0 4% 1rem;
  display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none;
}
.search-filters::-webkit-scrollbar { display: none; }
.filter-chip {
  flex: 0 0 auto; padding: 0.4rem 0.85rem;
  background: var(--bg-elev); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 99px; font-size: 0.78rem; font-weight: 600;
  color: var(--text-muted); transition: all 0.15s;
}
.filter-chip.active {
  background: var(--red); border-color: var(--red); color: #fff;
}

/* ═══════════════ DETAIL / PLAYER ═══════════════ */
.detail-hero, .player-hero {
  position: relative; width: 100%;
  height: 48vh; min-height: 260px; max-height: 420px;
  overflow: hidden; background: #000;
}
.detail-hero-bg, .player-hero-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center top;
  opacity: 0.55; filter: blur(1.5px); transform: scale(1.06);
}
.detail-hero::after, .player-hero::after {
  content: ''; position: absolute; inset: 0;
  background:
    linear-gradient(to right, rgba(20,20,20,0.92) 20%, transparent 70%),
    linear-gradient(to top, rgba(20,20,20,1) 0%, transparent 55%),
    linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, transparent 30%);
}
.detail-back, .player-back {
  position: absolute; top: calc(var(--safe-top) + 0.85rem); left: 4%; z-index: 5;
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-size: 0.85rem; font-weight: 600; color: var(--text-muted);
  padding: 0.4rem 0.65rem; border-radius: 6px;
  background: rgba(0,0,0,0.35); backdrop-filter: blur(8px);
  transition: color 0.15s, background 0.15s;
}
.detail-back:active, .player-back:active { color: var(--text); background: rgba(0,0,0,0.55); }
.detail-back svg, .player-back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }

.detail-hero-body, .player-hero-body {
  position: absolute; bottom: 1.35rem; left: 4%; right: 4%; z-index: 2;
  display: flex; gap: 1rem; align-items: flex-end;
}
.detail-poster {
  width: 92px; flex-shrink: 0; border-radius: 5px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.65);
  aspect-ratio: 2/3; object-fit: cover; background: var(--bg-elev);
}
.detail-info { flex: 1; min-width: 0; }
.detail-type-badge {
  display: inline-block; margin-bottom: 0.35rem;
  font-size: 0.6rem; font-weight: 700; padding: 2px 7px;
  border-radius: 3px; text-transform: uppercase; letter-spacing: 0.06em;
  background: var(--red); color: #fff;
}
.detail-type-badge.tv { background: #1a6bb5; }
.detail-title, .player-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(1.55rem, 6.5vw, 2.5rem);
  letter-spacing: 1px; line-height: 1.05; margin-bottom: 0.35rem;
}
.detail-meta-row {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.78rem; flex-wrap: wrap; margin-bottom: 0.25rem;
}
.info-chip {
  padding: 2px 7px; border: 1px solid rgba(255,255,255,0.18);
  border-radius: 3px; color: var(--text-muted); font-size: 0.72rem;
}
.info-rating { color: var(--green); font-weight: 700; }

.section { padding: 1.15rem 4% 0; }
.section-title {
  font-size: 1rem; font-weight: 700; margin-bottom: 0.75rem;
}
.overview-text {
  font-size: 0.88rem; line-height: 1.6; color: rgba(255,255,255,0.75);
}
.genre-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.75rem 0; }
.genre-tag {
  font-size: 0.72rem; font-weight: 600;
  padding: 0.28rem 0.7rem; border-radius: 99px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.05); color: var(--text-muted);
}
.action-row {
  display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.85rem;
}
.action-row .btn-red, .action-row .btn-play, .action-row .btn-ghost { flex: 1; min-width: 0; }
.icon-action-row { display: flex; gap: 0.45rem; margin-bottom: 0.5rem; }
.icon-action {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.18);
  color: var(--text-muted);
  display: grid; place-items: center;
  transition: color 0.15s, border-color 0.15s, background 0.15s, transform 0.12s;
}
.icon-action:active { transform: scale(0.9); color: var(--text); border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.07); }
.icon-action.is-on { color: #f43f5e; border-color: #f43f5e; background: rgba(244,63,94,0.1); }
.icon-action svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.icon-action.is-on svg[data-fill] { fill: currentColor; }

/* Cast */
.cast-row {
  display: flex; gap: 0.7rem; overflow-x: auto;
  scrollbar-width: none; padding-bottom: 0.25rem;
  -webkit-overflow-scrolling: touch;
}
.cast-row::-webkit-scrollbar { display: none; }
.cast-item { flex: 0 0 auto; width: 68px; text-align: center; }
.cast-avatar {
  width: 58px; height: 58px; border-radius: 50%; overflow: hidden;
  background: var(--bg-elev); margin: 0 auto 0.35rem;
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
}
.cast-avatar img { width: 100%; height: 100%; object-fit: cover; }
.cast-avatar-ph {
  width: 100%; height: 100%; display: grid; place-items: center;
  font-size: 1.1rem; font-weight: 700; color: var(--text-dim);
  font-family: 'Bebas Neue', sans-serif;
}
.cast-name { font-size: 0.66rem; font-weight: 600; line-height: 1.2; }
.cast-char { font-size: 0.58rem; color: var(--text-dim); margin-top: 0.1rem; }

/* ═══════════════ EPISODES ═══════════════ */
.season-tabs {
  display: flex; gap: 0.4rem; flex-wrap: nowrap;
  overflow-x: auto; scrollbar-width: none;
  margin-bottom: 1rem; padding-bottom: 2px;
}
.season-tabs::-webkit-scrollbar { display: none; }
.season-tab {
  flex: 0 0 auto; padding: 0.4rem 0.95rem; border-radius: 4px;
  font-size: 0.78rem; font-weight: 600;
  background: var(--bg-elev); color: var(--text-muted);
  border: 1px solid transparent; transition: all 0.15s;
}
.season-tab.active { background: var(--red); color: #fff; border-color: var(--red); }
.season-tab:active:not(.active) { color: var(--text); }

.ep-list { display: flex; flex-direction: column; gap: 0.55rem; }
.ep-card {
  display: flex; gap: 0.7rem; padding: 0.65rem;
  background: var(--bg-card); border-radius: 6px;
  border: 1px solid transparent; text-align: left; width: 100%;
  transition: background 0.15s, border-color 0.15s, transform 0.12s;
  touch-action: manipulation;
}
.ep-card:active { background: var(--bg-elev); transform: scale(0.99); }
.ep-card.active { border-color: var(--red); background: rgba(229,9,20,0.08); }
.ep-thumb {
  position: relative; flex-shrink: 0; width: 100px;
  border-radius: 4px; overflow: hidden; background: var(--bg-elev);
}
.ep-thumb img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
.ep-thumb-ph { width: 100%; aspect-ratio: 16/9; background: var(--bg-elev); }
.ep-num-badge {
  position: absolute; bottom: 3px; left: 5px;
  font-size: 0.65rem; font-weight: 700;
  text-shadow: 0 1px 3px rgba(0,0,0,0.9);
}
.ep-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.ep-title { font-size: 0.84rem; font-weight: 600; margin-bottom: 0.25rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ep-desc {
  font-size: 0.72rem; color: var(--text-muted); line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* Play card (watch page) */
.play-panel {
  margin: 1rem 4% 0;
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 8px; padding: 1.1rem;
  animation: fadeUp 0.4s var(--ease) both;
}
.play-panel-title {
  font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
  margin-bottom: 0.65rem;
}

/* ═══════════════ PAGE HEADERS ═══════════════ */
.page-pad { padding-top: calc(var(--navbar-h) + var(--safe-top) + 1rem); }
.page-heading {
  padding: 0 4% 1rem;
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(1.7rem, 7vw, 2.2rem); letter-spacing: 1.5px;
}
.page-sub {
  padding: 0 4% 1.25rem; font-size: 0.88rem; color: var(--text-muted);
  margin-top: -0.5rem;
}
.browse-back {
  padding: 0 4% 0.85rem; font-size: 0.85rem; color: var(--text-muted);
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-weight: 600;
}
.browse-back svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.2; }

/* ═══════════════ SURPRISE ═══════════════ */
.surprise-card {
  position: relative; border-radius: 10px; overflow: hidden;
  min-height: 360px; margin: 0 4% 1.25rem;
  background: var(--bg-card);
  box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  animation: fadeUp 0.45s var(--ease) both;
}
.surprise-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  filter: blur(20px); transform: scale(1.2); opacity: 0.4;
}
.surprise-grad {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(20,20,20,0.97) 0%, rgba(20,20,20,0.5) 50%, transparent 100%);
}
.surprise-inner {
  position: relative; z-index: 1; display: flex; flex-direction: column;
  gap: 1rem; padding: 1.5rem; min-height: 360px; justify-content: flex-end;
}
.surprise-poster {
  width: 120px; border-radius: 6px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.6); aspect-ratio: 2/3; object-fit: cover;
}

/* ═══════════════ SETTINGS ═══════════════ */
.settings-section { margin-bottom: 1.75rem; padding: 0 4%; }
.settings-label {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.65rem;
}
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.9rem 1rem; background: var(--bg-card); border-radius: 8px;
  margin-bottom: 0.45rem; border: 1px solid rgba(255,255,255,0.06);
  gap: 1rem;
}
.settings-row-label { font-size: 0.9rem; font-weight: 500; }
.settings-row-desc { font-size: 0.74rem; color: var(--text-dim); margin-top: 0.15rem; }
.toggle { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-track {
  position: absolute; inset: 0; background: var(--bg-elev);
  border-radius: 99px; transition: background 0.2s; cursor: pointer;
}
.toggle input:checked + .toggle-track { background: var(--red); }
.toggle-track::after {
  content: ''; position: absolute; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; top: 3px; left: 3px;
  transition: transform 0.2s var(--ease);
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.toggle input:checked + .toggle-track::after { transform: translateX(18px); }

/* ═══════════════ MOBILE NAV ═══════════════ */
#mobile-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 150;
  height: calc(var(--mobile-nav) + var(--safe-bot));
  padding-bottom: var(--safe-bot);
  background: rgba(10,10,10,0.96);
  border-top: 1px solid rgba(255,255,255,0.07);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  display: flex; justify-content: space-around; align-items: stretch;
}
.mobile-nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 0.18rem;
  padding: 0.35rem 0.15rem; cursor: pointer;
  color: var(--text-dim); transition: color 0.18s;
  font-size: 0.6rem; font-weight: 650; letter-spacing: 0.03em;
  touch-action: manipulation;
}
.mobile-nav-item.active { color: var(--text); }
.mobile-nav-item.active svg { color: var(--red); }
.mobile-nav-item svg {
  width: 22px; height: 22px; stroke: currentColor; fill: none;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  transition: color 0.18s, transform 0.18s;
}
.mobile-nav-item:active svg { transform: scale(0.88); }
.mobile-nav-item.active svg[data-fill-active] { fill: currentColor; stroke-width: 1.5; }

/* ═══════════════ MENU DRAWER ═══════════════ */
#menu-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
#menu-overlay.open { opacity: 1; pointer-events: all; }
#menu-drawer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 301;
  background: #1a1a1a;
  border-top: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px 16px 0 0;
  padding: 0 0 var(--safe-bot);
  transform: translateY(100%);
  transition: transform 0.32s var(--ease-drawer);
  max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
#menu-drawer.open { transform: translateY(0); }
.drawer-handle {
  width: 36px; height: 4px; background: rgba(255,255,255,0.2);
  border-radius: 2px; margin: 12px auto 6px;
}
.drawer-section-label {
  font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-dim);
  padding: 0.75rem 1.25rem 0.4rem;
}
.drawer-item {
  display: flex; align-items: center; gap: 0.85rem;
  padding: 0.75rem 1.15rem; margin: 0 0.4rem;
  font-size: 0.9rem; font-weight: 500; color: var(--text-muted);
  border-radius: 10px; transition: background 0.15s, color 0.15s;
  touch-action: manipulation;
}
.drawer-item:active { background: rgba(255,255,255,0.06); color: var(--text); }
.drawer-icon-wrap {
  width: 36px; height: 36px; border-radius: 8px;
  background: rgba(255,255,255,0.06);
  display: grid; place-items: center; flex-shrink: 0;
}
.drawer-icon-wrap svg {
  width: 18px; height: 18px; stroke: currentColor; fill: none;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85;
}
.drawer-sep { height: 1px; background: rgba(255,255,255,0.07); margin: 0.45rem 1.25rem; }
.drawer-genres {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0.35rem; padding: 0.35rem 0.85rem 0.6rem;
}
.drawer-genre {
  padding: 0.55rem 0.7rem; background: rgba(255,255,255,0.05);
  border-radius: 8px; font-size: 0.8rem; font-weight: 500;
  color: var(--text-muted); text-align: center;
  border: 1px solid rgba(255,255,255,0.06);
  transition: background 0.15s, color 0.15s;
}
.drawer-genre:active { background: rgba(255,255,255,0.12); color: var(--text); }

/* ═══════════════ TRAILER MODAL ═══════════════ */
.trailer-modal {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,0.94);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: calc(var(--safe-top) + 1rem) 4% calc(var(--safe-bot) + 1rem);
  animation: fadeIn 0.2s ease;
}
.trailer-close {
  align-self: flex-end; margin-bottom: 0.75rem;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.12);
  color: #fff; border-radius: 6px; padding: 0.45rem 0.9rem;
  font-size: 0.84rem; font-weight: 600;
}
.trailer-frame {
  width: 100%; max-width: 720px; aspect-ratio: 16/9;
  border-radius: 8px; overflow: hidden; background: #000;
}
.trailer-frame iframe { width: 100%; height: 100%; border: 0; }

/* ═══════════════ TOAST / STATES ═══════════════ */
#toast {
  position: fixed; left: 50%;
  bottom: calc(var(--mobile-nav) + var(--safe-bot) + 1rem);
  transform: translateX(-50%) translateY(12px);
  z-index: 500;
  background: var(--bg-elev); color: var(--text);
  padding: 0.65rem 1.3rem; border-radius: 4px;
  font-size: 0.85rem; font-weight: 550;
  box-shadow: 0 8px 28px rgba(0,0,0,0.55);
  opacity: 0; pointer-events: none;
  transition: opacity 0.22s, transform 0.22s var(--ease);
  max-width: 88vw; text-align: center; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.loading-state {
  padding: 4rem 4%; text-align: center; color: var(--text-muted);
}
.empty-state {
  padding: 3rem 4%; text-align: center; color: var(--text-dim); font-size: 0.9rem;
}
.error-box {
  margin: 1rem 4%; padding: 1rem;
  color: #f87171; background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.25); border-radius: 8px; font-size: 0.88rem;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,255,255,0.08);
  border-top-color: var(--red); border-radius: 50%;
  animation: spin 0.7s linear infinite; margin: 0 auto 0.85rem;
}
.spinner.sm { width: 22px; height: 22px; border-width: 2px; margin: 0; }

.footer-note {
  padding: 1.5rem 4% 0.5rem; font-size: 0.7rem; color: var(--text-dim);
  text-align: center;
}
.footer-note a { color: var(--text-muted); }

/* ═══════════════ SKELETON ═══════════════ */
.skel {
  background: linear-gradient(90deg, #1c1c1c 25%, #262626 50%, #1c1c1c 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease infinite;
  border-radius: 4px;
}
.skel-hero { height: min(72vh, 560px); min-height: 420px; border-radius: 0; }
.skel-row { display: flex; gap: 6px; padding: 0 4%; margin-bottom: 1.5rem; }
.skel-card { width: var(--card-w); aspect-ratio: 2/3; flex-shrink: 0; }

/* ═══════════════ ANIMATIONS ═══════════════ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes cardIn {
  from { opacity: 0; transform: scale(0.92) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ═══════════════ RESPONSIVE ═══════════════ */
@media (min-width: 480px) {
  :root { --card-w: 124px; }
  .search-grid, .browse-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .ep-thumb { width: 120px; }
}
@media (min-width: 768px) {
  :root { --card-w: 148px; --navbar-h: 64px; }
  .hero-content { left: 4%; bottom: 16%; max-width: 540px; }
  .hero-overview { display: -webkit-box; }
  .search-grid, .browse-grid {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    max-width: 1100px; margin: 0 auto;
  }
  .detail-poster { width: 110px; }
  .top10-rank { font-size: 5.5rem; }
}

body.theater #navbar { display: none; }

}

  color: var(--text-muted); font-size: 0.9rem; text-align: center;
  pointer-events: none;
}

  // ── Nav ──────────────────────────────────────────────────────────────────
  function navigate(name, params = {}, push = true) {
    if (push && route.name !== name) {
      historyStack.push({ ...route });
      if (historyStack.length > 40) historyStack.shift();
    }
    route = { name, params };
    closeSearch();
    closeDrawer();
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    render();
    syncTabs();
  }

  function goBack() {
    const prev = historyStack.pop();
    if (prev) {
      route = prev;
      closeSearch();
      closeDrawer();
      window.scrollTo(0, 0);
      render();
      syncTabs();
    } else {
      navigate('home', {}, false);
    }
  }

  function syncTabs() {
    const map = { home: 'home', movies: 'movies', tv: 'tv', list: 'list', trending: 'home', surprise: 'home', settings: 'more', genre: 'more', details: null, watch: null, search: null };
    const active = map[route.name];
    $$('.mobile-nav-item').forEach(t => {
      const nav = t.dataset.nav;
      t.classList.toggle('active', active != null && nav === active);
    });
  }

  // ── Storage ──────────────────────────────────────────────────────────────
  function readJson(key, fallback) {
    try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; } catch { return fallback; }
  }
  function writeJson(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

  function libraryHas(storeKey, type, id) {
    return readJson(storeKey, []).some(i => i.mediaType === type && String(i.tmdbId) === String(id));
  }
  function libraryToggle(storeKey, item) {
    const list = readJson(storeKey, []);
    const idx = list.findIndex(i => i.mediaType === item.mediaType && String(i.tmdbId) === String(item.tmdbId));
    if (idx >= 0) { list.splice(idx, 1); writeJson(storeKey, list); return false; }
    list.unshift({ ...item, addedAt: new Date().toISOString() });
    writeJson(storeKey, list.slice(0, 200));
    return true;
  }

  function cwKey(e) {
    return e.mediaType === 'tv' ? `tv:${e.contentId}:${e.season || 1}:${e.episode || 1}` : `movie:${e.contentId}`;
  }
  function recordWatch(entry) {
    const all = readJson(KEYS.continueWatching, []);
    const key = cwKey(entry);
    const existing = all.find(e => cwKey(e) === key);
    const next = {
      contentId: entry.contentId, mediaType: entry.mediaType,
      season: entry.mediaType === 'tv' ? entry.season : undefined,
      episode: entry.mediaType === 'tv' ? entry.episode : undefined,
      progress: entry.progress ?? existing?.progress ?? 0,
      duration: entry.duration ?? existing?.duration ?? null,
      lastWatched: new Date().toISOString(),
      title: entry.title, posterPath: entry.posterPath ?? existing?.posterPath ?? null,
    };
    writeJson(KEYS.continueWatching, [next, ...all.filter(e => cwKey(e) !== key)].slice(0, 40));
  }
  function getProgress(type, id, season, episode) {
    const key = cwKey({ mediaType: type, contentId: id, season, episode });
    return readJson(KEYS.continueWatching, []).find(e => cwKey(e) === key) || null;
  }

  function getSettings() {
    return readJson(KEYS.settings, { autoplay: true });
  }
  function setSetting(k, v) {
    const s = getSettings(); s[k] = v; writeJson(KEYS.settings, s);
  }

  // ── TMDB ─────────────────────────────────────────────────────────────────
  async function tmdb(path, params = {}) {
    const url = new URL(CONFIG.tmdbBase + path);
    url.searchParams.set('language', 'en-US');
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, String(v)));
    const res = await fetch(url.toString(), {
      headers: { Accept: 'application/json', Authorization: `Bearer ${CONFIG.tmdbToken}` }
    });
    if (!res.ok) throw new Error(`TMDB ${res.status}`);
    return res.json();
  }

  function img(path, size = 'w342') {
    return path ? `${CONFIG.imageBase}/${size}${path}` : null;
  }

  function mapItem(r, type) {
    const isMovie = type === 'movie';
    return {
      id: r.id, tmdbId: r.id, mediaType: type,
      title: (isMovie ? r.title : r.name) || 'Untitled',
      overview: r.overview || '',
      posterPath: r.poster_path || null,
      backdropPath: r.backdrop_path || null,
      releaseDate: (isMovie ? r.release_date : r.first_air_date) || null,
      voteAverage: r.vote_average || 0,
    };
  }

  function yearOf(d) { return d ? String(d).slice(0, 4) : null; }
  function matchPct(v) { return v > 0 ? `${Math.round(v * 10)}% Match` : ''; }

  async function fetchList(path, type, params = {}) {
    const data = await tmdb(path, params);
    return (data.results || []).map(r => {
      if (type === 'auto') return mapItem(r, r.media_type === 'tv' ? 'tv' : 'movie');
      return mapItem(r, type);
    });
  }

  // ── Player (native AVPlayer) ─────────────────────────────────────────────
  function isMp4Url(u) {
    const s = String(u || '');
    return /\.mp4(\?|$)/i.test(s) && !/\.mpd(\?|$)/i.test(s);
  }
  function isHlsUrl(u) {
    return /\.m3u8(\?|$)/i.test(String(u || ''));
  }
  function signedSource(s) {
    if (!s || typeof s !== 'object') return '';
    if (isMp4Url(s.progressiveUrl)) return String(s.progressiveUrl);
    return String(s.playlistPath || s.hlsUrl || s.directUrl || s.url || s.upstream || '');
  }
  function providerKey(s) {
    return String(s?.provider || s?.label || '').toLowerCase();
  }
  function pickAvPlayerUrl(data) {
    const menu = data.menuSources || data.sources || [];
    for (const s of menu) {
      const u = signedSource(s);
      const p = providerKey(s);
      if ((p.includes('dulo') || p.includes('delta')) && isHlsUrl(u)) return u;
    }
    for (const s of menu) {
      const u = signedSource(s);
      const p = providerKey(s);
      if ((p.includes('nflix') || /gcdn\.jsdzf/i.test(u)) && isHlsUrl(u)) return u;
    }
    for (const s of menu) {
      if (isMp4Url(s?.progressiveUrl)) return String(s.progressiveUrl);
      const u = signedSource(s);
      if (isMp4Url(u)) return u;
    }
    for (const s of menu) {
      const u = signedSource(s);
      if (isHlsUrl(u)) return u;
    }
    const top = String(data.url || data.directUrl || data.hlsUrl || data.progressiveUrl || '');
    if (isHlsUrl(top) || isMp4Url(top)) return top;
    return '';
  }

  async function fetchMint(type, id, season, episode, title) {
    const q = new URLSearchParams({ id: String(id), type });
    if (type === 'tv') {
      q.set('season', String(season || 1));
      q.set('episode', String(episode || 1));
    }
    if (title) q.set('title', title);
    const res = await fetch(`${CONFIG.apiBase}/api/mint-direct/api/v1/play?${q}`, {
      headers: { Accept: 'application/json', Referer: `${CONFIG.apiBase}/` },
    });
    if (!res.ok) throw new Error(`Stream lookup failed (${res.status})`);
    const data = await res.json();
    if (data.ok === false) throw new Error(data.error || data.message || 'No stream available');
    return data;
  }

  function closeHtml5Player() {
    const overlay = $('#av-overlay');
    const video = $('#av-video');
    if (video) {
      try { video.pause(); } catch {}
      video.removeAttribute('src');
      video.load();
    }
    overlay?.classList.remove('open');
    const st = $('#av-status');
    if (st) st.textContent = 'Loading stream…';
  }

  function openHtml5Player(url, startAt) {
    const overlay = $('#av-overlay');
    const video = $('#av-video');
    const status = $('#av-status');
    if (!overlay || !video) throw new Error('Player overlay missing');
    overlay.classList.add('open');
    if (status) status.textContent = 'Loading stream…';
    video.src = url;
    video.currentTime = 0;
    const onReady = () => {
      if (status) status.textContent = '';
      if (startAt > 0.5) video.currentTime = startAt;
      const play = video.play();
      if (play && play.catch) play.catch(() => {});
    };
    video.onloadedmetadata = onReady;
    video.onerror = () => {
      if (status) status.textContent = 'Stream failed to load';
    };
    video.load();
    const play = video.play();
    if (play && play.catch) play.catch(() => {});
  }

  async function launchPlayer({ type, id, season, episode, title, posterPath }) {
    const startAt = Number(getProgress(type, id, season, episode)?.progress || 0);
    const Native = window?.Capacitor?.Plugins?.NflixPlayer;
    if (Native && typeof Native.play === 'function') {
      await Native.play({
        type,
        id: Number(id),
        season: Number(season || 1),
        episode: Number(episode || 1),
        title: title || CONFIG.brand,
        startAt,
      });
      recordWatch({
        contentId: id, mediaType: type,
        season: type === 'tv' ? season : undefined,
        episode: type === 'tv' ? episode : undefined,
        progress: startAt, title, posterPath,
      });
      return true;
    }

    const data = await fetchMint(type, id, season, episode, title);
    const url = pickAvPlayerUrl(data);
    if (!url) throw new Error('No HLS or MP4 stream from mint');
    openHtml5Player(url, startAt);
    recordWatch({
      contentId: id, mediaType: type,
      season: type === 'tv' ? season : undefined,
      episode: type === 'tv' ? episode : undefined,
      progress: startAt, title, posterPath,
    });
    return true;
  }

  // ── Helpers ──────────────────────────────────────────────────────────────
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  const ICO = {
    play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',

  // ── Templates ────────────────────────────────────────────────────────────
  function cardHtml(item, opts = {}) {
    const poster = img(item.posterPath, 'w342');
    const year = yearOf(item.releaseDate);
    const match = item.voteAverage > 0 ? `${Math.round(item.voteAverage * 10)}%` : '';
    const openAttr = opts.openWatch
      ? `data-open-watch="${opts.openWatch}"`
      : `data-open-details="${item.mediaType}:${item.tmdbId}"`;
    const pct = opts.pct || 0;
    const top10 = opts.rank != null;

    if (top10) {
      return `
        <button type="button" class="c-card top10" ${openAttr}>
          <span class="top10-rank">${opts.rank}</span>
          <div class="top10-wrap">
            ${poster ? `<img src="${esc(poster)}" alt="" loading="lazy" />` : `<div class="c-card-ph">${esc((item.title || '?').slice(0, 1))}</div>`}
          </div>
          <span class="c-label">${esc(item.title)}</span>
        </button>`;
    }

    return `
      <button type="button" class="c-card" ${openAttr}>
        ${poster ? `<img src="${esc(poster)}" alt="" loading="lazy" />` : `<div class="c-card-ph">${esc((item.title || '?').slice(0, 1))}</div>`}
        <span class="c-badge ${item.mediaType === 'tv' ? 'tv' : 'movie'}">${item.mediaType === 'tv' ? 'TV' : 'MOVIE'}</span>
        ${match || year ? `<div class="c-rating-bar">${match || ''}${year ? ` <span>· ${esc(year)}</span>` : ''}</div>` : ''}
        ${pct ? `<div class="c-progress"><i style="width:${pct}%"></i></div>` : ''}
        <span class="c-label">${esc(item.title)}</span>
      </button>`;
  }

  function rowHtml(title, items, opts = {}) {
    if (!items || !items.length) return '';
    const cards = items.map((i, idx) => cardHtml(i, opts.top10 ? { rank: idx + 1 } : opts)).join('');
    return `
      <section class="carousel-section" ${opts.lazy ? 'data-lazy="true"' : ''}>
        <div class="carousel-header"><h2 class="carousel-title">${esc(title)}</h2></div>
        <div class="carousel-viewport"><div class="carousel-track">${cards}</div></div>
      </section>`;
  }

  function continueRowHtml(entries) {
    if (!entries.length) return '';
    const cards = entries.map(e => {
      const pct = e.duration && e.duration > 0 ? Math.min(100, (e.progress / e.duration) * 100) : (e.progress > 0 ? 12 : 0);
      const open = e.mediaType === 'tv' ? `tv:${e.contentId}:${e.season}:${e.episode}` : `movie:${e.contentId}`;
      return cardHtml({ ...e, tmdbId: e.contentId, title: e.title, releaseDate: null, voteAverage: 0, mediaType: e.mediaType, posterPath: e.posterPath }, { pct, openWatch: open });
    }).join('');
    return `
      <section class="carousel-section">
        <div class="carousel-header"><h2 class="carousel-title">Continue Watching</h2></div>
        <div class="carousel-viewport"><div class="carousel-track">${cards}</div></div>
      </section>`;
  }

  function heroHtml(item) {
    if (!item) return '';
    const bg = img(item.backdropPath, 'w1280') || img(item.posterPath, 'w780');
    const year = yearOf(item.releaseDate);
    const match = matchPct(item.voteAverage);
    return `
      <section class="hero">
        ${bg ? `<div class="hero-bg" style="background-image:url('${esc(bg)}')"></div>` : ''}
        <div class="hero-content">
          <div class="hero-badge">Trending Now</div>
          <h1 class="hero-title">${esc(item.title)}</h1>
          <div class="hero-meta">
            ${match ? `<span class="hero-rating">${esc(match)}</span>` : ''}
            ${year ? `<span class="hero-sep">·</span><span>${esc(year)}</span>` : ''}
            <span class="hero-sep">·</span>
            <span class="hero-chip">${item.mediaType === 'tv' ? 'TV Show' : 'Movie'}</span>
          </div>
          ${item.overview ? `<p class="hero-overview">${esc(item.overview)}</p>` : ''}
          <div class="hero-buttons">
            <button type="button" class="btn-play" data-open-watch="${item.mediaType}:${item.tmdbId}">${ICO.play} Play</button>
            <button type="button" class="btn-ghost" data-open-details="${item.mediaType}:${item.tmdbId}">${ICO.info} More Info</button>
          </div>
        </div>
      </section>`;
  }

  function skeletonHome() {
    return `
      <div class="skel skel-hero"></div>
      <div style="padding-top:1.5rem">
        ${[1,2,3].map(() => `
          <div style="padding:0 4% 0.55rem"><div class="skel" style="height:14px;width:140px"></div></div>
          <div class="skel-row">${[1,2,3,4,5].map(() => `<div class="skel skel-card"></div>`).join('')}</div>
        `).join('')}
      </div>`;
  }

  // ── Pages ────────────────────────────────────────────────────────────────
  async function renderHome() {
    const v = viewEl();
    v.innerHTML = skeletonHome();
    try {
      const cw = readJson(KEYS.continueWatching, []);
      const firstRows = HOME_ROWS.slice(0, 4);
      const restRows = HOME_ROWS.slice(4);

      const firstData = await Promise.all(
        firstRows.map(r => fetchList(r.path, r.type, r.params || {}).catch(() => []))
      );

      const heroPool = firstData[0] || [];
      const hero = heroPool.find(i => i.backdropPath) || heroPool[0];

      let html = `${heroHtml(hero)}<div class="home-rows">`;
      html += continueRowHtml(cw);
      firstRows.forEach((r, i) => {
        html += rowHtml(r.title, (firstData[i] || []).slice(0, r.top10 ? 10 : 18), { top10: r.top10 });
      });

      // Lazy placeholders for remaining rows
      restRows.forEach(r => {
        html += `
          <section class="carousel-section" data-lazy="true" data-row-id="${r.id}">
            <div class="carousel-header"><h2 class="carousel-title">${esc(r.title)}</h2></div>
            <div class="carousel-viewport"><div class="carousel-track" id="track-${r.id}">
              <div style="padding:1rem;color:var(--text-dim);font-size:0.78rem;display:flex;align-items:center;gap:0.6rem;">
                <div class="spinner sm"></div>Loading…
              </div>
            </div></div>
          </section>`;
      });
      html += `
        <p class="footer-note">
          Data by <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>
          · Streaming via FluxTV
        </p>

  function observeLazyRows(rows) {
    const loadObs = new IntersectionObserver(entries => {
      entries.forEach(async entry => {
        if (!entry.isIntersecting) return;
        const section = entry.target;
        if (section.dataset.loaded) return;
        section.dataset.loaded = '1';
        const rowId = section.dataset.rowId;
        const row = rows.find(r => r.id === rowId);
        if (!row) return;
        try {
          const items = await fetchList(row.path, row.type, row.params || {});
          const track = $(`#track-${row.id}`);
          if (track) {
            track.innerHTML = items.slice(0, 18).map(i => cardHtml(i)).join('');
            bindOpenButtons(track);
          }
        } catch {
          const track = $(`#track-${row.id}`);
          if (track) track.innerHTML = `<div style="padding:1rem;color:var(--text-dim);font-size:0.8rem;">Failed to load</div>`;
        }
        loadObs.unobserve(section);
      });
    }, { rootMargin: '280px' });

    $$('.carousel-section[data-row-id]').forEach(s => loadObs.observe(s));
  }

  function observeReveal() {
    const rev = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => entry.target.removeAttribute('data-lazy'));
        });
        rev.unobserve(entry.target);
      });
    }, { rootMargin: '40px' });
    $$('.carousel-section[data-lazy="true"]').forEach(s => rev.observe(s));
  }

        <div style="padding-top:1.25rem;padding-bottom:1rem">
          ${rowHtml('More Like This', [...(similar || []), ...(rec || [])].slice(0, 18))}
        </div>`;

      $('#play-now-btn').onclick = async () => {
        const btn = $('#play-now-btn');
        btn.disabled = true;
        btn.innerHTML = `<div class="spinner sm" style="border-top-color:#000;border-color:rgba(0,0,0,0.15);border-top-color:#000"></div> Loading stream…`;
        try {
          await launchPlayer({ type, id, season, episode, title, posterPath });
        } catch (err) {
          toast(err.message || 'Playback failed');
        } finally {
          btn.disabled = false;
          btn.innerHTML = `${ICO.play} Play Now`;
        }
      };

      if (getSettings().autoplay) {
        setTimeout(() => $('#play-now-btn')?.click(), 350);
      }

      if (summary) {
        $('#w-later').onclick = () => { const on = libraryToggle(KEYS.watchLater, summary); toast(on ? 'Added to My List' : 'Removed'); renderWatch(); };
        $('#w-fav').onclick = () => { const on = libraryToggle(KEYS.favorites, summary); toast(on ? 'Added to Favorites' : 'Removed'); renderWatch(); };
      }
      $('#w-share').onclick = async () => {
        try { if (navigator.share) await navigator.share({ title }); else toast('Sharing not available'); } catch {}
      };

      if (type === 'tv') {
        const goEp = (s, e) => navigate('watch', { type: 'tv', id, season: s, episode: e }, false);
        $$('[data-season]').forEach(btn => {
          btn.onclick = () => goEp(Number(btn.dataset.season), 1);
        });
        $$('[data-ep]').forEach(btn => {
          btn.onclick = () => goEp(season, Number(btn.dataset.ep));
        });
      }
    } catch (err) {
      v.innerHTML = `<div class="page-pad"><div class="error-box">${esc(err.message)}</div></div>`;
    }
  }

  // ── Router ───────────────────────────────────────────────────────────────
  async function render() {
    const v = viewEl();
    v.classList.remove('page-enter');
    void v.offsetWidth;
    v.classList.add('page-enter');

    const cinema = route.name === 'details' || route.name === 'watch';
    document.body.classList.toggle('theater', cinema);
    if (!cinema) $('#navbar').classList.toggle('scrolled', window.scrollY > 40);

    switch (route.name) {
      case 'home': await renderHome(); break;
      case 'movies': await renderCatalog('movie'); break;
      case 'tv': await renderCatalog('tv'); break;
      case 'trending': await renderTrending(); break;
      case 'genre': await renderGenre(); break;
      case 'surprise': await renderSurprise(); break;
      case 'list': renderList(); break;
      case 'settings': renderSettings(); break;
      case 'details': await renderDetails(); break;
      case 'watch': await renderWatch(); break;
      default: await renderHome();
    }
    bindOpenButtons(v);
  }

  function bindOpenButtons(root) {
    $$('[data-open-details]', root).forEach(el => {
      if (el._bound) return; el._bound = true;
      el.addEventListener('click', e => {
        e.stopPropagation();
        const [type, id] = el.dataset.openDetails.split(':');
        navigate('details', { type, id: Number(id) });
      });
    });
    $$('[data-open-watch]', root).forEach(el => {
      if (el._bound) return; el._bound = true;
      el.addEventListener('click', e => {
        e.stopPropagation();
        const parts = el.dataset.openWatch.split(':');
        if (parts[0] === 'tv' && parts.length >= 4) {
          navigate('watch', { type: 'tv', id: Number(parts[1]), season: Number(parts[2]), episode: Number(parts[3]) });
        } else {
          navigate('watch', { type: parts[0], id: Number(parts[1]), season: 1, episode: 1 });
        }
      });
    });
  }

  // ── Search ───────────────────────────────────────────────────────────────
  function openSearch() {
    const sheet = $('#search-sheet');
    sheet.hidden = false;
    sheet.classList.remove('hidden');
    $('#search-input').value = '';
    $('#search-results').innerHTML = '';
    $('#search-heading').classList.add('hidden');
    $('#search-state').classList.remove('hidden');
    $('#search-state').textContent = 'Type at least 2 characters to search';
    setTimeout(() => $('#search-input').focus(), 80);
  }
  function closeSearch() {
    const sheet = $('#search-sheet');
    sheet.hidden = true;
    sheet.classList.add('hidden');
  }

  // ── Drawer ───────────────────────────────────────────────────────────────
  function openDrawer() {
    $('#menu-overlay').classList.add('open');
    $('#menu-drawer').classList.add('open');
  }
  function closeDrawer() {
    $('#menu-overlay').classList.remove('open');
    $('#menu-drawer').classList.remove('open');
  }

  // ── Chrome ───────────────────────────────────────────────────────────────
  function bindChrome() {
    $('#nav-logo').onclick = () => navigate('home');
    $('#btn-search').onclick = openSearch;
    $('#search-close').onclick = closeSearch;
    $('#menu-overlay').onclick = closeDrawer;
    $('#btn-more').onclick = e => {
      e.stopPropagation();
      openDrawer();
    };

    $$('.mobile-nav-item').forEach(el => {
      el.addEventListener('click', () => {
        const nav = el.dataset.nav;
        if (nav === 'more') { openDrawer(); return; }
        if (nav) navigate(nav);
      });
    });

    $$('#menu-drawer [data-nav]').forEach(el => {
      el.addEventListener('click', () => {
        const nav = el.dataset.nav;
        closeDrawer();
        if (nav) navigate(nav);
      });
    });

    $$('#drawer-genres [data-genre]').forEach(el => {
      el.addEventListener('click', () => {
        closeDrawer();
        const genreId = el.dataset.genre;
        const gtype = el.dataset.gtype || 'movie';
        const lang = el.dataset.lang || null;
        const title = el.textContent.trim();
        navigate('genre', {
          genreId: lang ? null : genreId,
          gtype,
          lang: lang || (genreId === 'ko' ? 'ko' : null),
          title
        });
      });
    });

    $$('#search-filters [data-filter]').forEach(el => {
      el.addEventListener('click', () => {
        searchFilter = el.dataset.filter;
        $$('#search-filters [data-filter]').forEach(c => c.classList.toggle('active', c.dataset.filter === searchFilter));
        const q = $('#search-input').value.trim();
        if (q.length >= 2) runSearch(q);
      });
    });

    let searchTimer;
    $('#search-input').addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = $('#search-input').value.trim();
      if (q.length < 2) {
        $('#search-results').innerHTML = '';
        $('#search-heading').classList.add('hidden');
        $('#search-state').classList.remove('hidden');
        $('#search-state').textContent = 'Type at least 2 characters to search';
        return;
      }
      searchTimer = setTimeout(() => runSearch(q), 280);
    });

    $('#search-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const q = $('#search-input').value.trim();
        if (q) runSearch(q);
      }
    });

    window.addEventListener('scroll', () => {
      if (document.body.classList.contains('theater')) return;
      $('#navbar').classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });
    $('#av-close')?.addEventListener('click', closeHtml5Player);
  }

  async function runSearch(q) {
    const results = $('#search-results');
    const state = $('#search-state');
    const heading = $('#search-heading');
    state.classList.remove('hidden');
    state.innerHTML = `<div class="spinner sm" style="margin:0 auto 0.5rem"></div>Searching…`;
    results.innerHTML = '';
    try {
      const data = await tmdb('/search/multi', { query: q, include_adult: 'false' });
      let items = (data.results || [])
        .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
        .map(r => mapItem(r, r.media_type === 'tv' ? 'tv' : 'movie'));
      if (searchFilter !== 'all') items = items.filter(i => i.mediaType === searchFilter);
      state.classList.add('hidden');
      heading.classList.remove('hidden');
      heading.innerHTML = items.length
        ? `Results for <strong>“${esc(q)}”</strong> · ${items.length}`
        : `No results for <strong>“${esc(q)}”</strong>`;
      results.innerHTML = items.map(i => cardHtml(i)).join('');
      bindOpenButtons(results);
    } catch (err) {
      state.classList.remove('hidden');
      state.textContent = err.message;
    }
  }

  function bootstrapNotifications() {
    function schedulePush(seconds, message) {
      try {
        if (typeof push === 'function') { push(seconds, message); return; }
        if (typeof window.push === 'function') { window.push(seconds, message); return; }
      } catch {}
    }
    if (!localStorage.getItem(KEYS.pushBootstrapped)) {
      schedulePush(7, 'FluxTV — your next binge is waiting');
      localStorage.setItem(KEYS.pushBootstrapped, '1');
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        schedulePush(90, 'Come back to FluxTV — new trending titles are waiting.');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    bindChrome();
    bootstrapNotifications();
    navigate('home', {}, false);
  });
})();
</script>
</body>
</html>
