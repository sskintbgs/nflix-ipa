workflows:
  ios-unsigned-check:
    name: iPhone unsigned compile check
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      node: latest
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Show build tool versions
        script: |
          node --version
          npm --version
          xcodebuild -version

      - name: Install npm dependencies
        script: npm ci

      - name: Prepare Capacitor iOS project
        script: npm run sync:ios

      - name: Build iPhone app without signing
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/ios/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-signed-release:
    name: iPhone sideload IPA (development signed)
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: codemagic

    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: com.sskin.nflixipa

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Show build tool versions
        script: |
          node --version
          npm --version
          xcodebuild -version

      - name: Install npm dependencies
        script: npm ci

      - name: Prepare Capacitor iOS project
        script: npm run sync:ios

      - name: Initialize keychain
        script: keychain initialize

      - name: Apply iOS signing profiles
        script: xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      ios:
        register_devices:
          - 00008150-00025D8E34E2401C
